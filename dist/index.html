<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f6f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="糖糖日记" />
    <meta name="description" content="新生儿日常照护记录，轻松记喂奶、尿布、黄疸、体温与健康信息。" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icon-apple.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
    <title>糖糖日记 · 宝宝照护记录</title>
  </head>
  <body>
    <div class="desktop-intro" aria-hidden="true">
      <div class="desktop-brand">
        <div class="desktop-mark">糖</div>
        <p class="desktop-eyebrow">新生儿照护 · 单人记录</p>
        <h1>糖糖日记</h1>
        <p>喂奶、尿布、黄疸、体温。<br />把每一天照护得清清楚楚。</p>
      </div>
      <div class="desktop-highlights">
        <span>专为 iPhone 设计</span>
        <span>夜间单手操作</span>
        <span>记录保存在本设备</span>
      </div>
    </div>
    <div class="app-shell" id="app-shell">
      <div class="app-inner">
        <header class="app-top">
          <button type="button" class="identity" data-action="home" aria-label="返回今天">
            <span class="brand-mark" aria-hidden="true">糖</span>
            <span class="brand-title">糖糖日记<small>宝宝的日常记录</small></span>
          </button>
          <button type="button" class="header-round" data-action="theme" aria-label="切换夜间模式">
            <span id="theme-icon" aria-hidden="true"></span>
          </button>
        </header>
        <main id="view" class="view" aria-live="polite">
          <div class="loading-state">正在准备宝宝记录…</div>
        </main>
        <nav class="bottom-nav" id="bottom-nav" aria-label="主导航"></nav>
      </div>
    </div>
    <div id="sheet-root"></div>
    <div id="toast-root" role="status" aria-live="polite"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
